[package]
name = "foundation-zed"
version = "0.1.0"
edition = "2021"
authors = ["Foundation Authors"]
license = "Apache-2.0"
description = "Foundation (.fdn) language support for the Zed editor"
repository = "https://github.com/galihanggara68/foundation-zed"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zed_extension_api = "0.7.0"

[dev-dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
